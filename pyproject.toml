[project]
name = "ai-engineering"
version = "0.1.0"
description = "AI engineering voor leerlingen: van een eerste AI call naar agents"
readme = "README.md"
authors = [
    { name = "Adhibera", email = "info@adhibera.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
les1 = "ai_engineering.ai_call:main"
les2 = "ai_engineering.chat:main"
les3 = "ai_engineering.memory:main"
les4 = "ai_engineering.tools:main"
les5 = "ai_engineering.structured_output:main"
les6 = "ai_engineering.control:main"
les7 = "ai_engineering.recovery:main"
les8 = "ai_engineering.feedback:main"
les9 = "ai_engineering.retrieval:main"
les10 = "ai_engineering.prompt_chaining:main"
les11 = "ai_engineering.routing:main"
les12 = "ai_engineering.parallelization:main"
les13 = "ai_engineering.agent_loop:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
