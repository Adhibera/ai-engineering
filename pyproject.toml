[project]
name = "ai-engineering"
version = "0.1.0"
description = "AI engineering voor leerlingen: van een eerste AI call naar agents"
readme = "README.md"
authors = [
    { name = "Adhibera", email = "info@adhibera.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.31.0",
    "openai-agents>=0.24.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
les1 = "ai_engineering.les01_ai_call:main"
les2 = "ai_engineering.les02_chat:main"
les3 = "ai_engineering.les03_memory:main"
les4 = "ai_engineering.les04_tools:main"
les5 = "ai_engineering.les05_structured_output:main"
les6 = "ai_engineering.les06_control:main"
les7 = "ai_engineering.les07_recovery:main"
les8 = "ai_engineering.les08_feedback:main"
les9 = "ai_engineering.les09_retrieval:main"
les10 = "ai_engineering.les10_prompt_chaining:main"
les11 = "ai_engineering.les11_routing:main"
les12 = "ai_engineering.les12_parallelization:main"
les13 = "ai_engineering.les13_agent_loop:main"
les14 = "ai_engineering.les14_logboek:main"
les15 = "ai_engineering.les15_controleur:main"
les16 = "ai_engineering.les16_framework:main"
les17 = "ai_engineering.les17_batch:main"
les18 = "ai_engineering.les18_herstart:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
